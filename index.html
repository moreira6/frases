
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formando Frases com Imagens</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff5e8;color:#633b20;font-family:Arial,sans-serif}
header{background:#ff963e;color:white;padding:18px;text-align:center}
header h1{margin:0;font-size:30px}
header p{margin:7px}
.top{display:flex;justify-content:space-around;align-items:center;flex-wrap:wrap;gap:10px;padding:14px}
.info{background:white;padding:12px 22px;border-radius:15px;font-weight:bold}
.progress{height:12px;background:#ead9c5;border-radius:20px;margin:0 auto 18px;max-width:900px;overflow:hidden}
.bar{height:100%;background:#54c98c;width:0%;transition:.3s}
main{max-width:1100px;margin:auto;padding:15px}
.game{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:white;padding:20px;border-radius:22px;box-shadow:0 5px 18px #0001}
h2{font-size:19px;margin:0 0 15px}
.scene{
height:310px;border-radius:18px;
background:linear-gradient(#72ceff 0%,#d9f5ff 65%,#8edb6c 65%,#65bd4c 100%);
position:relative;display:flex;align-items:center;justify-content:center;
overflow:hidden;border:5px solid #fff0d6;
}
.scene:before{content:"☀️";position:absolute;right:20px;top:12px;font-size:35px}
.scene:after{content:"☁️";position:absolute;left:20px;top:22px;font-size:35px}
.scene .art{font-size:100px;z-index:2;text-align:center;line-height:1.5}
.scene .ground{position:absolute;bottom:-35px;width:110%;height:65px;background:#75c94f;border-radius:50%}
.hint{background:#fff5d9;padding:12px;border-radius:12px;margin-top:12px;font-size:14px}
.answer{min-height:110px;border:3px dashed #f0ae60;border-radius:15px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;background:#fffaf3}
.placeholder{color:#b6a28e;font-size:14px}
.words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#fff4e6;padding:15px;border-radius:15px;min-height:85px}
.word{border:0;background:#ffca65;color:#633b20;padding:12px 17px;border-radius:12px;font-size:18px;font-weight:bold;box-shadow:0 4px #d99b38;cursor:grab;touch-action:manipulation}
.word:active{transform:scale(.96)}
.answer .word{background:#c7f0d8;box-shadow:0 4px #86c9a3}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}
button.action{border:0;padding:13px 18px;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer}
.check{background:#35b96d;color:white;flex:1}
.reset{background:#e7edfa;color:#425a87}
.next{background:#ff963e;color:white;flex:1}
.feedback{margin-top:14px;padding:13px;border-radius:12px;text-align:center;font-weight:bold}
.good{background:#dcf8e7;color:#18844a}
.bad{background:#fff0d7;color:#a66b19}
footer{text-align:center;padding:20px;color:#a17d5b}
@media(max-width:750px){.game{grid-template-columns:1fr}.scene{height:250px}header h1{font-size:24px}.card{padding:14px}}
</style>
</head>
<body>
<header>
<h1>🧩 Formando Frases com Imagens</h1>
<p>Observe, pense e organize as palavras!</p>
</header>

<div class="top">
<div class="info">⭐ Pontos: <span id="score">0</span></div>
<div class="info">🎯 Desafio <span id="number">1</span> de 25</div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>

<main id="app">
<div class="game">
<section class="card">
<h2>🖼️ Observe a imagem</h2>
<div class="scene">
<div class="art" id="art"></div>
<div class="ground"></div>
</div>
<div class="hint">💡 <span id="hint"></span></div>
</section>

<section class="card">
<h2>✏️ Forme uma frase sobre a imagem:</h2>
<div class="answer" id="answer">
<span class="placeholder">Arraste as palavras para cá!</span>
</div>
<h2 style="margin-top:25px">Palavras disponíveis:</h2>
<div class="words" id="words"></div>
<div class="actions">
<button class="action reset" onclick="resetRound()">↶ Recomeçar</button>
<button class="action check" onclick="verify()">✓ Verificar</button>
</div>
<div id="feedback"></div>
</section>
</div>
</main>
<footer>🌈 Aprender brincando é muito mais divertido!</footer>

<script>
const challenges=[
["⚽","O menino chuta a bola.",["O","menino","chuta","a","bola"],"O que o menino está fazendo?"],
["🐱🥛","O gato bebe leite.",["O","gato","bebe","leite"],"O que o gato está bebendo?"],
["🐶💤","O cachorro está dormindo.",["O","cachorro","está","dormindo"],"O que o cachorro está fazendo?"],
["👧🍎","A menina come uma maçã.",["A","menina","come","uma","maçã"],"Qual fruta a menina come?"],
["🐦🌳","O pássaro está na árvore.",["O","pássaro","está","na","árvore"],"Onde está o pássaro?"],
["👦📚","O menino lê um livro.",["O","menino","lê","um","livro"],"O que o menino está lendo?"],
["🐰🥕","O coelho come cenoura.",["O","coelho","come","cenoura"],"O que o coelho come?"],
["🌞🌻","O sol ilumina as flores.",["O","sol","ilumina","as","flores"],"O que o sol ilumina?"],
["👧🎨","A menina pinta um desenho.",["A","menina","pinta","um","desenho"],"O que a menina está fazendo?"],
["🚲👦","O menino anda de bicicleta.",["O","menino","anda","de","bicicleta"],"Como o menino passeia?"],
["🐸💧","O sapo pula na lagoa.",["O","sapo","pula","na","lagoa"],"Onde o sapo pula?"],
["👩🍰","A mamãe faz um bolo.",["A","mamãe","faz","um","bolo"],"O que a mamãe prepara?"],
["🐝🌼","A abelha visita a flor.",["A","abelha","visita","a","flor"],"Quem visita a flor?"],
["👦🪁","O menino empina uma pipa.",["O","menino","empina","uma","pipa"],"O que o menino empina?"],
["🐢🌿","A tartaruga come folhas.",["A","tartaruga","come","folhas"],"O que a tartaruga come?"],
["🚗🛣️","O carro vermelho está na rua.",["O","carro","vermelho","está","na","rua"],"De que cor é o carro?"],
["👧🌧️","A menina usa um guarda-chuva.",["A","menina","usa","um","guarda-chuva"],"O que protege a menina?"],
["🐟🌊","O peixe nada no mar.",["O","peixe","nada","no","mar"],"Onde o peixe nada?"],
["👨‍🍳🥣","O cozinheiro prepara a sopa.",["O","cozinheiro","prepara","a","sopa"],"O que o cozinheiro prepara?"],
["🦋🌸","A borboleta pousa na flor.",["A","borboleta","pousa","na","flor"],"Onde a borboleta pousa?"],
["👧🧸","A menina abraça seu ursinho.",["A","menina","abraça","seu","ursinho"],"O que a menina abraça?"],
["🐄🌱","A vaca come capim.",["A","vaca","come","capim"],"O que a vaca come?"],
["👦🪥","O menino escova os dentes.",["O","menino","escova","os","dentes"],"O que o menino escova?"],
["🚂🌳","O trem passa pela floresta.",["O","trem","passa","pela","floresta"],"Por onde passa o trem?"],
["👧🌙⭐","A menina observa as estrelas.",["A","menina","observa","as","estrelas"],"O que a menina observa?"]
];

let current=0,score=0,placed=[],pool=[],checked=false;

const $=id=>document.getElementById(id);

function shuffle(arr){
let a=[...arr];
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function load(){
let c=challenges[current];
placed=[];
pool=shuffle(c[2]);
checked=false;
$("art").textContent=c[0];
$("hint").textContent=c[3];
$("number").textContent=current+1;
$("score").textContent=score;
$("bar").style.width=(current/25*100)+"%";
$("feedback").innerHTML="";
render();
}

function render(){
let answer=$("answer");
answer.innerHTML="";
if(!placed.length){
answer.innerHTML='<span class="placeholder">Arraste as palavras para cá!</span>';
}
placed.forEach((w,i)=>{
let b=document.createElement("button");
b.className="word";
b.textContent=w;
b.draggable=!checked;
b.onclick=()=>removeWord(i);
b.ondragstart=e=>{
e.dataTransfer.setData("text/plain",JSON.stringify({from:"answer",index:i}));
};
answer.appendChild(b);
});
answer.ondragover=e=>e.preventDefault();
answer.ondrop=e=>{
e.preventDefault();
let data=JSON.parse(e.dataTransfer.getData("text/plain"));
if(data.from==="pool") addWord(data.index);
};

let bank=$("words");
bank.innerHTML="";
pool.forEach((w,i)=>{
let b=document.createElement("button");
b.className="word";
b.textContent=w;
b.draggable=!checked;
b.onclick=()=>addWord(i);
b.ondragstart=e=>{
e.dataTransfer.setData("text/plain",JSON.stringify({from:"pool",index:i}));
};
bank.appendChild(b);
});
bank.ondragover=e=>e.preventDefault();
bank.ondrop=e=>{
e.preventDefault();
let data=JSON.parse(e.dataTransfer.getData("text/plain"));
if(data.from==="answer")removeWord(data.index);
};
}

function addWord(i){
if(checked||i<0||i>=pool.length)return;
placed.push(pool.splice(i,1)[0]);
render();
}

function removeWord(i){
if(checked)return;
pool.push(placed.splice(i,1)[0]);
render();
}

function resetRound(){
if(checked)return;
placed=[];
pool=shuffle(challenges[current][2]);
$("feedback").innerHTML="";
render();
}

function verify(){
if(checked)return;
let correct=challenges[current][2];
if(placed.length!==correct.length){
$("feedback").innerHTML='<div class="feedback bad">Complete a frase antes de verificar!</div>';
return;
}
checked=true;
if(placed.join(" ")===correct.join(" ")){
score+=10;
$("score").textContent=score;
$("bar").style.width=((current+1)/25*100)+"%";
$("feedback").innerHTML='<div class="feedback good">🎉 Muito bem! Frase correta!</div>';
let btn=document.createElement("button");
btn.className="action next";
btn.style.marginTop="12px";
btn.textContent=current===24?"Ver resultado 🏆":"Próximo desafio →";
btn.onclick=next;
$("feedback").appendChild(btn);
}else{
checked=false;
$("feedback").innerHTML='<div class="feedback bad">Quase! Tente organizar as palavras novamente.</div>';
}
render();
}

function next(){
if(current===24){
$("app").innerHTML=`
<section class="card" style="text-align:center;padding:50px">
<div style="font-size:75px">🏆</div>
<h1>Parabéns!</h1>
<h2>Você concluiu os 25 desafios!</h2>
<h1 style="color:#ff963e">${score} pontos</h1>
<button class="action next" onclick="restart()">Jogar novamente</button>
</section>`;
return;
}
current++;
load();
}

function restart(){
current=0;score=0;
$("app").innerHTML=`
<div class="game">
<section class="card">
<h2>🖼️ Observe a imagem</h2>
<div class="scene"><div class="art" id="art"></div><div class="ground"></div></div>
<div class="hint">💡 <span id="hint"></span></div>
</section>
<section class="card">
<h2>✏️ Forme uma frase sobre a imagem:</h2>
<div class="answer" id="answer"></div>
<h2 style="margin-top:25px">Palavras disponíveis:</h2>
<div class="words" id="words"></div>
<div class="actions">
<button class="action reset" onclick="resetRound()">↶ Recomeçar</button>
<button class="action check" onclick="verify()">✓ Verificar</button>
</div>
<div id="feedback"></div>
</section></div>`;
load();
}
load();
</script>
</body>
</html>
